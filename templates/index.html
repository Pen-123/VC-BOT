<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Discord Bot Controller</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; }
        select, input, button { margin: 0.5rem 0; padding: 0.5rem; width: 100%; box-sizing: border-box; }
        .section { margin: 1.5rem 0; }
        .log { font-size: 0.9rem; color: #555; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <h1>🎵 Discord Bot Panel</h1>

    <div class="section">
        <label>Server:</label>
        <select id="guildSelect" onchange="loadChannels()">
            <option value="">-- Select a server --</option>
        </select>
    </div>

    <div class="section">
        <label>Voice Channel:</label>
        <select id="channelSelect">
            <option value="">-- Select a voice channel --</option>
        </select>
        <button onclick="joinVC()">📞 Join Voice Channel</button>
        <div id="vcStatus" class="log"></div>
    </div>

    <div class="section">
        <label>Upload MP3:</label>
        <input type="file" id="mp3File" accept=".mp3">
        <button onclick="uploadMP3()">📤 Upload</button>
        <div id="uploadStatus" class="log"></div>
    </div>

    <div class="section">
        <button onclick="playAudio()" style="background:#2ecc71;color:white;">▶️ Play</button>
        <button onclick="stopAudio()" style="background:#e74c3c;color:white;">⏹️ Stop</button>
    </div>

    <script>
        const API = "";
        async function loadGuilds() {
            const res = await fetch(API + "/guilds");
            const guilds = await res.json();
            const sel = document.getElementById("guildSelect");
            sel.innerHTML = '<option value="">-- Select a server --</option>';
            guilds.forEach(g => {
                sel.innerHTML += `<option value="${g.id}">${g.name}</option>`;
            });
        }

        async function loadChannels() {
            const guildId = document.getElementById("guildSelect").value;
            if (!guildId) return;
            const res = await fetch(`${API}/channels/${guildId}`);
            const channels = await res.json();
            const sel = document.getElementById("channelSelect");
            sel.innerHTML = '<option value="">-- Select a voice channel --</option>';
            channels.forEach(c => {
                sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
        }

        async function joinVC() {
            const guildId = document.getElementById("guildSelect").value;
            const channelId = document.getElementById("channelSelect").value;
            if (!guildId || !channelId) return alert("Select server and channel");
            const res = await fetch(API + "/join", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({guild_id: guildId, channel_id: channelId})
            });
            const data = await res.json();
            document.getElementById("vcStatus").textContent = res.ok
                ? `Connected to #${data.channel}`
                : `Error: ${data.detail}`;
        }

        async function uploadMP3() {
            const fileInput = document.getElementById("mp3File");
            const file = fileInput.files[0];
            if (!file) return alert("Choose a file");
            const form = new FormData();
            form.append("file", file);
            const res = await fetch(API + "/upload", {method: "POST", body: form});
            const data = await res.json();
            document.getElementById("uploadStatus").textContent = res.ok
                ? `Uploaded ${data.filename} (${data.size} bytes)`
                : `Error: ${data.detail}`;
        }

        async function playAudio() {
            const res = await fetch(API + "/play", {method: "POST"});
            const data = await res.json();
            if (!res.ok) alert(data.detail);
        }

        async function stopAudio() {
            await fetch(API + "/stop", {method: "POST"});
        }

        window.onload = loadGuilds;
    </script>
</body>
</html>
