<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord Bot Controller</title>

<style>
:root {
    --bg:#1e1e2f;
    --panel:#2a2a3d;
    --accent:#5865f2;
    --danger:#ed4245;
    --success:#57f287;
    --text:#fff;
    --secondary:#aaaabd;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body {
    font-family:system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.dashboard {
    width:100%;
    max-width:500px;
    background:var(--panel);
    padding:30px;
    border-radius:16px;
}

h1 {
    margin-bottom:25px;
}

.status {
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:20px;
    padding:12px;
    border-radius:8px;
    background:#202033;
}

.dot {
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--danger);
}

.dot.online {
    background:var(--success);
}

select,
button {
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #44445b;
    background:#303047;
    color:white;
    font-size:15px;
}

button {
    background:var(--accent);
    border:none;
    cursor:pointer;
    font-weight:600;
}

button:hover {
    filter:brightness(.9);
}

button.danger {
    background:var(--danger);
}

.section {
    margin-bottom:20px;
}

label {
    display:block;
    color:var(--secondary);
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.file-area {
    border:2px dashed #44445b;
    padding:20px;
    text-align:center;
    border-radius:8px;
    position:relative;
}

.file-area input {
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
}

.controls {
    display:flex;
    gap:8px;
}

.controls button {
    flex:1;
}

.message {
    color:var(--secondary);
    margin-top:8px;
    font-size:13px;
    min-height:18px;
}

hr {
    border:0;
    border-top:1px solid #44445b;
    margin:25px 0;
}
</style>
</head>

<body>

<div class="dashboard">

<h1>🎵 Bot Panel</h1>

<div class="status">

    <span id="botDot" class="dot"></span>

    <span id="botStatus">
        Connecting to Discord...
    </span>

</div>

<div class="status">

    <span id="voiceDot" class="dot"></span>

    <span id="voiceStatus">
        Not in voice
    </span>

</div>


<div class="section">

<label>SERVER</label>

<select id="guildSelect"
        onchange="loadChannels()">

<option value="">
Loading servers...
</option>

</select>

</div>


<div class="section">

<label>VOICE CHANNEL</label>

<select id="channelSelect">

<option value="">
Select a server first
</option>

</select>

<button onclick="joinVC()">
📞 Join Voice Channel
</button>

<div id="joinStatus"
     class="message">
</div>

</div>


<hr>


<div class="section">

<label>MP3 FILE</label>

<div class="file-area">

📁 Click or drag an MP3 here

<input
    type="file"
    id="mp3File"
    accept=".mp3"
    onchange="handleFile(this.files)"
>

</div>

<div id="fileName"
     class="message">
</div>

<button onclick="uploadMP3()">
📤 Upload
</button>

<div id="uploadStatus"
     class="message">
</div>

</div>


<div class="controls">

<button onclick="playAudio()">
▶️ Play
</button>

<button class="danger"
        onclick="stopAudio()">
⏹️ Stop
</button>

</div>

<div id="playStatus"
     class="message">
</div>

</div>


<script>

const API = "";


async function refreshStatus() {

    try {

        const res =
            await fetch(API + "/status");

        if (!res.ok)
            throw new Error();

        const data =
            await res.json();


        // Discord status

        const botDot =
            document.getElementById("botDot");

        const botStatus =
            document.getElementById("botStatus");


        if (data.bot_connected) {

            botDot.classList.add("online");

            botStatus.textContent =
                "Discord connected";

        } else {

            botDot.classList.remove("online");

            botStatus.textContent =
                "Discord disconnected";
        }


        // Voice status

        const voiceDot =
            document.getElementById("voiceDot");

        const voiceStatus =
            document.getElementById("voiceStatus");


        if (data.voice_connected) {

            voiceDot.classList.add("online");

            voiceStatus.textContent =
                "Connected to #" +
                (data.channel_name || "Voice");

        } else {

            voiceDot.classList.remove("online");

            voiceStatus.textContent =
                "Not in voice";
        }

    } catch (e) {

        document.getElementById("botDot")
            .classList.remove("online");

        document.getElementById("botStatus")
            .textContent =
            "Server unavailable";
    }
}


async function loadGuilds() {

    const select =
        document.getElementById("guildSelect");

    try {

        const res =
            await fetch(API + "/guilds");

        if (!res.ok)
            throw new Error();

        const guilds =
            await res.json();


        select.innerHTML =
            '<option value="">-- Select server --</option>';


        for (const guild of guilds) {

            const option =
                document.createElement("option");

            option.value = guild.id;

            option.textContent =
                guild.name;

            select.appendChild(option);
        }

    } catch (e) {

        select.innerHTML =
            '<option value="">Discord still connecting...</option>';
    }
}


async function loadChannels() {

    const guildId =
        document.getElementById("guildSelect").value;

    const select =
        document.getElementById("channelSelect");


    if (!guildId) {

        select.innerHTML =
            '<option value="">Select a server first</option>';

        return;
    }


    try {

        const res =
            await fetch(
                API + "/channels/" + guildId
            );

        if (!res.ok)
            throw new Error();

        const channels =
            await res.json();


        select.innerHTML =
            '<option value="">-- Select voice channel --</option>';


        for (const channel of channels) {

            const option =
                document.createElement("option");

            option.value =
                channel.id;

            option.textContent =
                "# " + channel.name;

            select.appendChild(option);
        }

    } catch (e) {

        select.innerHTML =
            '<option value="">Failed to load channels</option>';
    }
}


async function joinVC() {

    const guildId =
        document.getElementById("guildSelect").value;

    const channelId =
        document.getElementById("channelSelect").value;

    const status =
        document.getElementById("joinStatus");


    if (!guildId || !channelId) {

        status.textContent =
            "Select a server and voice channel first.";

        return;
    }


    status.textContent =
        "Connecting...";


    try {

        const res =
            await fetch(
                API + "/join",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                        "application/json"
                    },
                    body:JSON.stringify({
                        guild_id:guildId,
                        channel_id:channelId
                    })
                }
            );


        const data =
            await res.json();


        if (!res.ok) {

            status.textContent =
                "❌ " +
                (data.detail || "Failed");

            return;
        }


        status.textContent =
            "✅ Connected to #" +
            data.channel;


        await refreshStatus();

    } catch (e) {

        status.textContent =
            "❌ Network error";
    }
}


function handleFile(files) {

    if (!files.length)
        return;

    document.getElementById("fileName")
        .textContent =
        files[0].name;
}


async function uploadMP3() {

    const file =
        document.getElementById("mp3File")
        .files[0];

    const status =
        document.getElementById("uploadStatus");


    if (!file) {

        status.textContent =
            "Select an MP3 first.";

        return;
    }


    status.textContent =
        "Uploading...";


    const form =
        new FormData();

    form.append("file", file);


    try {

        const res =
            await fetch(
                API + "/upload",
                {
                    method:"POST",
                    body:form
                }
            );


        const data =
            await res.json();


        if (!res.ok) {

            status.textContent =
                "❌ " +
                (data.detail || "Upload failed");

            return;
        }


        status.textContent =
            `✅ ${data.filename} uploaded`;

    } catch (e) {

        status.textContent =
            "❌ Upload failed";
    }
}


async function playAudio() {

    const status =
        document.getElementById("playStatus");

    status.textContent =
        "Starting...";


    try {

        const res =
            await fetch(
                API + "/play",
                {
                    method:"POST"
                }
            );


        const data =
            await res.json();


        if (!res.ok) {

            status.textContent =
                "❌ " +
                (data.detail || "Playback failed");

            return;
        }


        status.textContent =
            "▶️ Playing";

    } catch (e) {

        status.textContent =
            "❌ Request failed";
    }
}


async function stopAudio() {

    const status =
        document.getElementById("playStatus");


    try {

        const res =
            await fetch(
                API + "/stop",
                {
                    method:"POST"
                }
            );


        if (res.ok)
            status.textContent =
                "⏹️ Stopped";

        else
            status.textContent =
                "❌ Stop failed";

    } catch (e) {

        status.textContent =
            "❌ Request failed";
    }
}


// Initial

refreshStatus();
loadGuilds();


// Keep UI updated

setInterval(refreshStatus, 3000);

setInterval(async () => {

    const current =
        document.getElementById("guildSelect").value;

    if (current)
        return;

    await loadGuilds();

}, 5000);

</script>

</body>
</html>
